services:
  db:
    image: postgres:17
    container_name: reminder_bot_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reminder_bot}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build: .
    image: ${REMINDER_BOT_IMAGE:-reminder-bot:local}
    container_name: reminder_bot_migrate
    command: alembic upgrade head
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    profiles: ["tools"]

  bot:
    build: .
    image: ${REMINDER_BOT_IMAGE:-reminder-bot:local}
    container_name: reminder_bot_app
    command: python -m app.main
    env_file:
      - .env
    environment:
      VOICE_TEMP_DIR: ${VOICE_TEMP_DIR:-/var/lib/reminder-bot/voice-temp}
    volumes:
      - ${VOICE_RUNTIME_DIR:-/opt/reminder-bot/voice-runtime}:/opt/reminder-bot/voice:ro
      - voice_temp:/var/lib/reminder-bot/voice-temp
    init: true
    stop_grace_period: 30s
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PUBLISH_HOST:-0.0.0.0}:8080:8080"
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  worker:
    build: .
    image: ${REMINDER_BOT_IMAGE:-reminder-bot:local}
    container_name: reminder_bot_worker
    command: python -m app.worker_main
    env_file:
      - .env
    environment:
      VOICE_TEMP_DIR: ${VOICE_TEMP_DIR:-/var/lib/reminder-bot/voice-temp}
    volumes:
      - voice_temp:/var/lib/reminder-bot/voice-temp
    init: true
    stop_grace_period: 45s
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
    name: reminder_bot_postgres_data
  voice_temp:
    name: reminder_bot_voice_temp
